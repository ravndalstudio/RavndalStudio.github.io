        <script>
            (function(){
                try {
                    var langs = navigator.languages || [navigator.language || navigator.userLanguage || 'en'];
                    var primary = (langs[0] || 'en').toLowerCase();
                    var p = location.pathname || '';
                    
                    // Sjekk om vi er norske
                    var isNorwegian = primary.indexOf('no') === 0 || 
                                    primary.indexOf('nb') === 0 || 
                                    primary.indexOf('nn') === 0;

                    if (isNorwegian) {
                        location.replace('no/index.html' + location.search + location.hash);
                    } else {
                        location.replace('en/index.html' + location.search + location.hash);
                    }
                } catch (e) {
                    // Hvis noe feiler, send til engelsk som backup
                    window.location.href = "en/index.html";
                }
            })();
        </script>
